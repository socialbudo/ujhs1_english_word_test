<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운정고 1학년 영어 수행평가 대비 v2.0</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --correct-color: #16a34a;
            --incorrect-color: #dc2626;
            --border-color: #cbd5e1;
            --star-color: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            position: relative;
        }

        .maker-tag {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: -0.3px;
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 20px;
            color: #0f172a;
            word-break: keep-all;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen Styles */
        .section-group {
            margin-bottom: 16px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .day-checkbox {
            display: none;
        }

        .day-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 4px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s;
            user-select: none;
        }

        .day-checkbox:checked + .day-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .radio-group {
            display: flex;
            gap: 8px;
        }

        .radio-label {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        input[type="radio"]:checked + .radio-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        input[type="radio"] {
            display: none;
        }

        .btn-select-all {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-start:hover {
            background: var(--primary-hover);
        }

        /* Game Screen Styles */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 8px;
            height: 8px;
            margin-bottom: 14px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .day-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-quit {
            background: none;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        /* Card Styles */
        .card {
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 14px;
            min-height: 170px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            position: relative;
        }

        .btn-star {
            position: absolute;
            top: 12px;
            right: 14px;
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: #cbd5e1;
            transition: color 0.2s;
        }

        .btn-star.active {
            color: var(--star-color);
        }

        .sentence {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .translation {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: keep-all;
        }

        .word-display {
            margin-top: 14px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--incorrect-color);
            min-height: 32px;
        }

        /* Tip Banner */
        .tip-banner {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 14px;
            text-align: center;
            font-weight: 500;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        .test-input {
            flex: 1;
            padding: 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        .test-input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit-large {
            padding: 12px 20px;
            font-size: 1.05rem;
            font-weight: 700;
            min-width: 90px;
            border-radius: 8px;
        }

        .feedback {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-align: center;
            min-height: 26px;
        }

        .feedback.correct { color: var(--correct-color); }
        .feedback.incorrect { color: var(--incorrect-color); }

        .btn-nav-group {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            flex: 1;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-nav:hover {
            background: #f8fafc;
        }

        .btn-action {
            background: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-action:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="maker-tag">made by 임윤 & 제미나이 (v2.0)</div>

    <!-- 시작 화면 -->
    <div id="start-screen" class="screen active">
        <h1>운정고 1학년 영어 수행평가 대비 v2.0</h1>

                <div><input type="checkbox" id="day27" class="day-checkbox" value="27"><label for="day27" class="day-label">Day 27</label></div>

                <div><input type="checkbox" id="day35" class="day-checkbox" value="35"><label for="day35" class="day-label">Day 35</label></div>
                <div><input type="checkbox" id="day36" class="day-checkbox" value="36"><label for="day36" class="day-label">Day 36</label></div>
                <div><input type="checkbox" id="day37" class="day-checkbox" value="37"><label for="day37" class="day-label">Day 37</label></div>
                <div><input type="checkbox" id="day38" class="day-checkbox" value="38"><label for="day38" class="day-label">Day 38</label></div>

        <div class="section-group">

            <div class="radio-group">
                <input type="radio" id="filter-all" name="study-filter" value="all" checked>
                <label for="filter-all" class="radio-label">전체 단어</label>
                <input type="radio" id="filter-star" name="study-filter" value="star">

                <input type="radio" id="filter-wrong" name="study-filter" value="wrong">
                <label for="filter-wrong" class="radio-label">❌ 오답노트</label>
            </div>
        </div>

        <div class="section-group">
            <div class="section-title">게임 모드 선택</div>
            <div class="radio-group">
                <input type="radio" id="mode-swipe" name="game-mode" value="swipe" checked>
                <label for="mode-swipe" class="radio-label">스와이프(훑어보기)</label>

            </div>
        </div>

        <div class="section-group">
            <div class="section-title">정렬 선택</div>
            <div class="radio-group">
                <input type="radio" id="sort-all" name="sort-mode" value="all" checked>
                <label for="sort-all" class="radio-label">전체 (섞음)</label>
                <input type="radio" id="sort-day" name="sort-mode" value="day">
                <label for="sort-day" class="radio-label">Day 별로</label>
            </div>
        </div>

        <button class="btn-start" id="btn-start">학습 시작하기</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <span class="progress-text" id="progress-text">0 / 0</span>
            <span class="day-badge" id="day-badge" style="display: none;">Day --</span>
            <button class="btn-quit" id="btn-quit">그만하기</button>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- 스마트 안내 팁 배너 -->
        <div class="tip-banner" id="tip-banner">
            💡 팁: [Enter] 1회 입력 = 채점 / 2회 입력 = 다음 문제로 이동!
        </div>

        <div class="card">
            <button class="btn-star" id="btn-star" title="즐겨찾기 추가">⭐️</button>
            <div class="sentence" id="card-sentence">---</div>
            <div class="translation" id="card-translation">---</div>
            
            <!-- 스와이프 모드 정답 영역 -->
            <div class="word-display" id="word-display" style="display: none;"></div>
        </div>

        <!-- 테스트 모드 컨트롤 -->
        <div id="test-controls" style="display: none;">
            <div class="feedback" id="feedback"></div>
            <div class="input-group">
                <input type="text" class="test-input" id="test-input" placeholder="정답 단어 입력" autocomplete="off">
                <button class="btn-nav btn-action btn-submit-large" id="btn-submit">확인</button>
            </div>
        </div>

        <!-- 스와이프 모드 컨트롤 -->
        <div id="swipe-controls" style="display: none; margin-bottom: 12px;">
            <button class="btn-start" id="btn-show-answer" style="background: #475569;">정답 보기</button>
        </div>

        <!-- 화살표 버튼 -->
        <div class="btn-nav-group">
            <button class="btn-nav" id="btn-prev">← 이전</button>
            <button class="btn-nav" id="btn-next">다음 →</button>
        </div>
    </div>
</div>

<script>
    // 운정고 1학년 영어 수행평가 대비 전체 데이터베이스
    const vocabularyData = [
        // Day 21
        { id: "21_1", day: 21, word: "worsened", initial: "w", sentence: "His condition has ____ since he left the hospital.", translation: "퇴원한 이후로 그의 건강 상태는 악화되었다." },
        { id: "21_2", day: 21, word: "broaden", initial: "b", sentence: "Life is a chance to learn things and ____ your personal experiences.", translation: "인생은 무언가를 배우고 당신의 개인적인 경험을 넓힐 기회이다." },
        { id: "21_3", day: 21, word: "fasten", initial: "f", sentence: "Please ____ your seatbelt for safety on board.", translation: "기내 안전을 위해 안전띠를 매 주세요." },
        { id: "21_4", day: 21, word: "hastened", initial: "h", sentence: "He ____ down the stairs to welcome his guests.", translation: "그는 손님을 맞이하기 위해서 계단을 서둘러 내려갔다." },
        { id: "21_5", day: 21, word: "dispensable", initial: "d", sentence: "No one in the world is ____, regardless of their situation.", translation: "상황에 상관없이 세상에 없어도 되는 사람은 없다." },
        { id: "21_6", day: 21, word: "durable", initial: "d", sentence: "This bag is both ____ and lightweight, making it perfect for travel.", translation: "이 가방은 튼튼하고 가벼워서 여행에 안성맞춤이다." },
        { id: "21_7", day: 21, word: "credible", initial: "c", sentence: "People often think that a video is ____ if it has thousands of likes.", translation: "사람들은 흔히 좋아요 수가 수천 개면 동영상이 믿을 만하다고 생각한다." },
        { id: "21_8", day: 21, word: "divisible", initial: "d", sentence: "Nine is ____ by three, but not by four.", translation: "9는 3으로 나눌 수 있지만 4로는 나눌 수 없다." },
        { id: "21_9", day: 21, word: "audible", initial: "a", sentence: "The fire alarm was clearly ____ to staff members.", translation: "그 화재 경보음은 직원들에게 또렷하게 들렸다." },

        { id: "22_26", day: 22, word: "sole", initial: "s", sentence: "He was the ____ survivor of the accident.", translation: "그는 그 사고의 유일한 생존자였다." },

        { id: "36_6", day: 36, word: "prime", initial: "p", sentence: "Social welfare was the ____ issue in the debate.", translation: "사회 복지가 토론에서의 주요 쟁점이었다." },

        { id: "36_9", day: 36, word: "complex", initial: "c", sentence: "Consider each person's ____ personality of positive and negative traits.", translation: "각 개인이 가진 긍정적·부정적 특성으로 이루어진 복잡한 성격을 고려하라." },
        { id: "36_10", day: 36, word: "deposit", initial: "d", sentence: "He paid the ____ for his house.", translation: "그는 자신의 집의 계약금을 지불했다." },
        { id: "36_11", day: 36, word: "suits", initial: "s", sentence: "The red dress ____ you well.", translation: "그 빨간 드레스는 네게 잘 어울린다." },
        { id: "36_12", day: 36, word: "property", initial: "p", sentence: "The police recovered the stolen ____ after a week.", translation: "경찰은 일주일 뒤에 도난당한 재산을 회수했다." },

        { id: "36_14", day: 36, word: "tune", initial: "t", sentence: "He played a blues ____ on his guitar.", translation: "그는 기타로 블루스 곡을 연주했다." },
        { id: "36_15", day: 36, word: "commanded", initial: "c", sentence: "The general ____ his troops to attack.", translation: "장군은 그의 부대에게 공격하라고 명령했다." },
        { id: "36_16", day: 36, word: "contract", initial: "c", sentence: "Read the ____ carefully before you sign.", translation: "서명하기 전에 계약서를 주의 깊게 읽으세요." },
        { id: "36_17", day: 36, word: "account", initial: "a", sentence: "I'd like to open a bank ____.", translation: "저는 은행 계좌를 개설하고 싶습니다." },
        { id: "36_18", day: 36, word: "suspended", initial: "s", sentence: "The website ____ service due to server problems.", translation: "그 웹 사이트는 서버 문제로 서비스를 중단했다." },
        { id: "36_19", day: 36, word: "committed", initial: "c", sentence: "The criminal ____ the crime in broad daylight.", translation: "그 범죄자는 대낮에 범행을 저질렀다." },
        { id: "36_20", day: 36, word: "issue", initial: "i", sentence: "We need plenty of time to think about this ____.", translation: "우리는 이 문제에 대해 생각할 충분한 시간이 필요하다." }
    ];

    // 로컬 스토리지 관리 객체
    const StorageManager = {
        getStars: () => JSON.parse(localStorage.getItem('ungjung_stars') || '[]'),
        toggleStar: (id) => {
            let stars = StorageManager.getStars();
            if (stars.includes(id)) {
                stars = stars.filter(s => s !== id);
            } else {
                stars.push(id);
            }
            localStorage.setItem('ungjung_stars', JSON.stringify(stars));
            return stars.includes(id);
        },
        getWrongs: () => JSON.parse(localStorage.getItem('ungjung_wrongs') || '[]'),
        addWrong: (id) => {
            let wrongs = StorageManager.getWrongs();
            if (!wrongs.includes(id)) {
                wrongs.push(id);
                localStorage.setItem('ungjung_wrongs', JSON.stringify(wrongs));
            }
        },
        removeWrong: (id) => {
            let wrongs = StorageManager.getWrongs().filter(w => w !== id);
            localStorage.setItem('ungjung_wrongs', JSON.stringify(wrongs));
        }
    };

    // 상태 변수
    let selectedDays = [];
    let studyFilter = 'all';
    let gameMode = 'swipe';
    let sortMode = 'all';
    let currentPlaylist = [];
    let currentIndex = 0;
    let isCheckedState = false;
    let correctCount = 0;

    // DOM 요소
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const btnSelectAll = document.getElementById('btn-select-all');
    const btnStart = document.getElementById('btn-start');
    const btnQuit = document.getElementById('btn-quit');
    
    const progressText = document.getElementById('progress-text');
    const progressBar = document.getElementById('progress-bar');
    const dayBadge = document.getElementById('day-badge');
    const btnStar = document.getElementById('btn-star');
    const cardSentence = document.getElementById('card-sentence');
    const cardTranslation = document.getElementById('card-translation');
    const wordDisplay = document.getElementById('word-display');
    
    const testControls = document.getElementById('test-controls');
    const swipeControls = document.getElementById('swipe-controls');
    const testInput = document.getElementById('test-input');
    const feedback = document.getElementById('feedback');
    
    const btnSubmit = document.getElementById('btn-submit');
    const btnShowAnswer = document.getElementById('btn-show-answer');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // 모두 선택/해제
    let allSelected = false;
    btnSelectAll.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.day-checkbox');
        allSelected = !allSelected;
        checkboxes.forEach(cb => cb.checked = allSelected);
        btnSelectAll.textContent = allSelected ? "모두 해제" : "모두 선택";
    });

    // 셔플 함수
    function shuffle(array) {
        let curIndex = array.length, randomIndex;
        while (curIndex != 0) {
            randomIndex = Math.floor(Math.random() * curIndex);
            curIndex--;
            [array[curIndex], array[randomIndex]] = [array[randomIndex], array[curIndex]];
        }
        return array;
    }

    // 학습 시작
    btnStart.addEventListener('click', () => {
        studyFilter = document.querySelector('input[name="study-filter"]:checked').value;
        const checkboxes = document.querySelectorAll('.day-checkbox:checked');
        selectedDays = Array.from(checkboxes).map(cb => parseInt(cb.value));

        if (studyFilter === 'all' && selectedDays.length === 0) {
            alert('최소 하나 이상의 Day를 선택해 주세요!');
            return;
        }

        gameMode = document.querySelector('input[name="game-mode"]:checked').value;
        sortMode = document.querySelector('input[name="sort-mode"]:checked').value;

        let filteredData = [];
        if (studyFilter === 'star') {
            const stars = StorageManager.getStars();
            filteredData = vocabularyData.filter(item => stars.includes(item.id));
            if (filteredData.length === 0) {
                alert('⭐️ 즐겨찾기한 단어가 없습니다!');
                return;
            }
        } else if (studyFilter === 'wrong') {
            const wrongs = StorageManager.getWrongs();
            filteredData = vocabularyData.filter(item => wrongs.includes(item.id));
            if (filteredData.length === 0) {
                alert('❌ 오답노트에 저장된 단어가 없습니다!');
                return;
            }
        } else {
            filteredData = vocabularyData.filter(item => selectedDays.includes(item.day));
            if (filteredData.length === 0) {
                alert('선택한 Day에 해당하는 단어가 없습니다.');
                return;
            }
        }

        if (sortMode === 'all') {
            currentPlaylist = shuffle([...filteredData]);
        } else {
            currentPlaylist = [];
            let uniqueDays = [...new Set(filteredData.map(i => i.day))].sort((a,b)=>a-b);
            uniqueDays.forEach(dayNum => {
                let dayItems = filteredData.filter(item => item.day === dayNum);
                currentPlaylist.push(...shuffle(dayItems));
            });
        }

        currentIndex = 0;
        correctCount = 0;

        startScreen.classList.remove('active');
        gameScreen.classList.add('active');

        if (gameMode === 'swipe') {
            swipeControls.style.display = 'block';
            testControls.style.display = 'none';
            wordDisplay.style.display = 'block';
        } else {
            swipeControls.style.display = 'none';
            testControls.style.display = 'block';
            wordDisplay.style.display = 'none';
        }

        dayBadge.style.display = (sortMode === 'day' && studyFilter === 'all') ? 'inline-block' : 'none';

        renderCard();
    });

    // 그만하기
    btnQuit.addEventListener('click', () => {
        if (confirm("학습을 중단하고 메인으로 돌아가시겠습니까?")) {
            gameScreen.classList.remove('active');
            startScreen.classList.add('active');
        }
    });

    // 별표 토글 버튼
    btnStar.addEventListener('click', () => {
        const item = currentPlaylist[currentIndex];
        const isStarred = StorageManager.toggleStar(item.id);
        updateStarUI(isStarred);
    });

    function updateStarUI(isStarred) {
        if (isStarred) {
            btnStar.classList.add('active');
            btnStar.textContent = '⭐️';
        } else {
            btnStar.classList.remove('active');
            btnStar.textContent = '☆';
        }
    }

    // 카드 렌더링
    function renderCard() {
        const item = currentPlaylist[currentIndex];

        progressText.textContent = `${currentIndex + 1} / ${currentPlaylist.length}`;
        progressBar.style.width = `${((currentIndex + 1) / currentPlaylist.length) * 100}%`;
        
        cardSentence.textContent = `${item.sentence} (${item.initial})`;
        cardTranslation.textContent = item.translation;

        if (sortMode === 'day' && studyFilter === 'all') {
            dayBadge.textContent = `Day ${item.day}`;
        }

        // 즐겨찾기 상태 반영
        const stars = StorageManager.getStars();
        updateStarUI(stars.includes(item.id));

        wordDisplay.textContent = '';
        testInput.value = '';
        feedback.textContent = '';
        feedback.className = 'feedback';
        isCheckedState = false;

        if (gameMode === 'test') {
            setTimeout(() => testInput.focus(), 50);
        }
    }

    // 스와이프 - 정답 보기
    btnShowAnswer.addEventListener('click', () => {
        const item = currentPlaylist[currentIndex];
        wordDisplay.textContent = item.word;
    });

    // 테스트 - 정답 확인
    function checkAnswer() {
        const item = currentPlaylist[currentIndex];
        const userInputValue = testInput.value.trim().toLowerCase();
        const targetWord = item.word.toLowerCase();

        if (userInputValue === targetWord) {
            feedback.textContent = `O (${item.word})`;
            feedback.className = 'feedback correct';
            correctCount++;
            StorageManager.removeWrong(item.id); // 맞히면 오답노트에서 제거
        } else {
            feedback.textContent = `X (${item.word})`;
            feedback.className = 'feedback incorrect';
            StorageManager.addWrong(item.id); // 틀리면 오답노트 추가
        }
        isCheckedState = true;
    }

    btnSubmit.addEventListener('click', () => {
        if (!isCheckedState) {
            checkAnswer();
        } else {
            goToNext();
        }
    });

    // 엔터키 조작
    testInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (!isCheckedState) {
                checkAnswer();
            } else {
                goToNext();
            }
        }
    });

    // 다음 문제 이동 함수
    function goToNext() {
        if (currentIndex < currentPlaylist.length - 1) {
            currentIndex++;
            renderCard();
        } else {
            const accuracy = Math.round((correctCount / currentPlaylist.length) * 100);
            alert(`🎉 학습 완료!\n총 ${currentPlaylist.length}문제 중 ${correctCount}개 정답 (${accuracy}%)`);
            gameScreen.classList.remove('active');
            startScreen.classList.add('active');
        }
    }

    // 이전 / 다음 버튼
    btnPrev.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        } else {
            alert('첫 번째 단어입니다.');
        }
    });

    btnNext.addEventListener('click', goToNext);
</script>
