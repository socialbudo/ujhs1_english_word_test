<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>운정고 1학년 영어 수행평가 대비 웹사이트</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --correct-color: #16a34a;
            --incorrect-color: #dc2626;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        /* 노트북 화면 및 모바일 모두 컴팩트하게 보이도록 최대 너비 축소 */
        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            padding: 24px;
            position: relative;
        }

        h1 {
            font-size: 1.25rem;
            text-align: center;
            margin-bottom: 20px;
            color: #0f172a;
            word-break: keep-all;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Start Screen Styles */
        .section-group {
            margin-bottom: 16px;
            background: #f8fafc;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        .section-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .day-checkbox {
            display: none;
        }

        .day-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
            user-select: none;
        }

        .day-checkbox:checked + .day-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .day-checkbox:disabled + .day-label {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .radio-group {
            display: flex;
            gap: 8px;
        }

        .radio-label {
            flex: 1;
            text-align: center;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        input[type="radio"]:checked + .radio-label {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        input[type="radio"] {
            display: none;
        }

        .btn-select-all {
            background: none;
            border: none;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-start {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .btn-start:hover {
            background: var(--primary-hover);
        }

        /* Game Screen Styles */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .progress-text {
            font-weight: 700;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .day-badge {
            background: #dbeafe;
            color: #1e40af;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .btn-quit {
            background: none;
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card {
            background: #fff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .sentence {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 10px;
            word-break: keep-all;
        }

        .translation {
            color: var(--text-muted);
            font-size: 0.88rem;
            line-height: 1.4;
            word-break: keep-all;
        }

        .word-display {
            margin-top: 14px;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--incorrect-color);
            min-height: 32px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .test-input {
            flex: 1;
            padding: 10px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .test-input:focus {
            border-color: var(--primary-color);
        }

        .feedback {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 10px;
            text-align: center;
            min-height: 24px;
        }

        .feedback.correct { color: var(--correct-color); }
        .feedback.incorrect { color: var(--incorrect-color); }

        .btn-nav-group {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            flex: 1;
            padding: 10px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn-nav:hover {
            background: #f8fafc;
        }

        .btn-action {
            background: var(--primary-color);
            color: white;
            border: none;
            font-size: 0.9rem;
        }

        .btn-action:hover {
            background: var(--primary-hover);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 시작 화면 -->
    <div id="start-screen" class="screen active">
        <h1>운정고 1학년 영어 수행평가 대비</h1>

        <div class="section-group">
            <div class="section-title">
                <span>Day 선택</span>
                <button type="button" class="btn-select-all" id="btn-select-all">모두 선택</button>
            </div>
            <div class="day-grid">
                <div><input type="checkbox" id="day21" class="day-checkbox" value="21"><label for="day21" class="day-label">Day 21</label></div>
                <div><input type="checkbox" id="day22" class="day-checkbox" value="22"><label for="day22" class="day-label">Day 22</label></div>
                <div><input type="checkbox" id="day23" class="day-checkbox" value="23"><label for="day23" class="day-label">Day 23</label></div>
                <div><input type="checkbox" id="day24" class="day-checkbox" value="24"><label for="day24" class="day-label">Day 24</label></div>
                <div><input type="checkbox" id="day25" class="day-checkbox" value="25"><label for="day25" class="day-label">Day 25</label></div>
                <div><input type="checkbox" id="day26" class="day-checkbox" value="26"><label for="day26" class="day-label">Day 26</label></div>
                <!-- 확장 대비 비활성화 영역 -->
                <div><input type="checkbox" id="day27" class="day-checkbox" disabled><label for="day27" class="day-label">Day 27</label></div>
                <div><input type="checkbox" id="day28" class="day-checkbox" disabled><label for="day28" class="day-label">Day 28</label></div>
                <div><input type="checkbox" id="day29" class="day-checkbox" disabled><label for="day29" class="day-label">Day 29</label></div>
            </div>
        </div>

        <div class="section-group">
            <div class="section-title">게임 모드 선택</div>
            <div class="radio-group">
                <input type="radio" id="mode-swipe" name="game-mode" value="swipe" checked>
                <label for="mode-swipe" class="radio-label">스와이프(훑어보기)</label>
                <input type="radio" id="mode-test" name="game-mode" value="test">
                <label for="mode-test" class="radio-label">테스트(입력하기)</label>
            </div>
        </div>

        <div class="section-group">
            <div class="section-title">정렬 선택</div>
            <div class="radio-group">
                <input type="radio" id="sort-all" name="sort-mode" value="all" checked>
                <label for="sort-all" class="radio-label">전체 (모두 섞음)</label>
                <input type="radio" id="sort-day" name="sort-mode" value="day">
                <label for="sort-day" class="radio-label">Day 별로</label>
            </div>
        </div>

        <button class="btn-start" id="btn-start">학습 시작하기</button>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="screen">
        <div class="game-header">
            <span class="progress-text" id="progress-text">0 / 0</span>
            <span class="day-badge" id="day-badge" style="display: none;">Day --</span>
            <button class="btn-quit" id="btn-quit">그만하기</button>
        </div>

        <div class="card">
            <div class="sentence" id="card-sentence">---</div>
            <div class="translation" id="card-translation">---</div>
            
            <!-- 스와이프 모드 정답 영역 -->
            <div class="word-display" id="word-display" style="display: none;"></div>
        </div>

        <!-- 테스트 모드 컨트롤 -->
        <div id="test-controls" style="display: none;">
            <div class="feedback" id="feedback"></div>
            <div class="input-group">
                <input type="text" class="test-input" id="test-input" placeholder="정답 단어 입력" autocomplete="off">
                <button class="btn-nav btn-action" id="btn-submit">확인</button>
            </div>
        </div>

        <!-- 스와이프 모드 컨트롤 -->
        <div id="swipe-controls" style="display: none; margin-bottom: 12px;">
            <button class="btn-start" id="btn-show-answer" style="background: #475569;">정답 보기</button>
        </div>

        <!-- 직관적인 화살표 버튼 적용 -->
        <div class="btn-nav-group">
            <button class="btn-nav" id="btn-prev">← 이전</button>
            <button class="btn-nav" id="btn-next">다음 →</button>
        </div>
    </div>
</div>

<script>
    // 선생님 정답지 기준 180개 단어 데이터 (수정 반영 완료)
    const vocabularyData = [
        // Day 21
        { day: 21, word: "worsened", initial: "w", sentence: "His condition has ____ since he left the hospital.", translation: "퇴원한 이후로 그의 건강 상태는 악화되었다." },
        { day: 21, word: "broaden", initial: "b", sentence: "Life is a chance to learn things and ____ your personal experiences.", translation: "인생은 무언가를 배우고 당신의 개인적인 경험을 넓힐 기회이다." },
        { day: 21, word: "fasten", initial: "f", sentence: "Please ____ your seatbelt for safety on board.", translation: "기내 안전을 위해 안전띠를 매 주세요." },
        { day: 21, word: "hastened", initial: "h", sentence: "He ____ down the stairs to welcome his guests.", translation: "그는 손님을 맞이하기 위해서 계단을 서둘러 내려갔다." },
        { day: 21, word: "dispensable", initial: "d", sentence: "No one in the world is ____, regardless of their situation.", translation: "상황에 상관없이 세상에 없어도 되는 사람은 없다." },
        { day: 21, word: "durable", initial: "d", sentence: "This bag is both ____ and lightweight, making it perfect for travel.", translation: "이 가방은 튼튼하고 가벼워서 여행에 안성맞춤이다." },
        { day: 21, word: "credible", initial: "c", sentence: "People often think that a video is ____ if it has thousands of likes.", translation: "사람들은 흔히 좋아요 수가 수천 개면 동영상이 믿을 만하다고 생각한다." },
        { day: 21, word: "divisible", initial: "d", sentence: "Nine is ____ by three, but not by four.", translation: "9는 3으로 나눌 수 있지만 4로는 나눌 수 없다." },
        { day: 21, word: "audible", initial: "a", sentence: "The fire alarm was clearly ____ to staff members.", translation: "그 화재 경보음은 직원들에게 또렷하게 들렸다." },
        { day: 21, word: "edible", initial: "e", sentence: "Walking through the forest, you may find some ____ flowers.", translation: "숲속을 걷다가, 당신은 식용 꽃을 발견할 수도 있다." },
        { day: 21, word: "eligible", initial: "e", sentence: "Not everyone is ____ to participate in the competition.", translation: "모든 사람이 그 대회에 참가할 자격이 있는 것은 아니다." },
        { day: 21, word: "tangible", initial: "t", sentence: "Archaeologists tend to focus mostly on ____ aspects of culture.", translation: "고고학자들은 주로 문화의 실제적인 측면에 초점을 맞추는 경향이 있다." },
        { day: 21, word: "bilingual", initial: "b", sentence: "We are looking for a secretary who is ____ in Korean and English.", translation: "우리는 한국어와 영어 2개 국어를 구사하는 비서를 구하고 있다." },
        { day: 21, word: "duplicate", initial: "d", sentence: "Could you ____ this report before the deadline?", translation: "마감 시간 전에 이 보고서를 복사해 주실 수 있나요?" },
        { day: 21, word: "twilight", initial: "t", sentence: "He hadn't come back home by ____.", translation: "그는 땅거미가 질 무렵까지 집에 돌아오지 않았다." },
        { day: 21, word: "trivial", initial: "t", sentence: "People often quarrel over ____ matters.", translation: "사람들은 종종 사소한 문제로 다툰다." },
        { day: 21, word: "tribe", initial: "t", sentence: "The book covers the history of a ____ in Africa.", translation: "그 책은 아프리카에 사는 한 부족의 역사를 다루고 있다." },
        { day: 21, word: "deduce", initial: "d", sentence: "The class struggled to ____ the answer to the question.", translation: "학급 학생들은 그 질문에 대한 답을 추론하려고 애썼다." },
        { day: 21, word: "educate", initial: "e", sentence: "We need to ____ people about road safety.", translation: "우리는 사람들에게 도로 안전에 대해 가르칠 필요가 있다." },
        { day: 21, word: "conducted", initial: "c", sentence: "They ____ a survey on the dietary habits of adults.", translation: "그들은 성인의 식습관에 대한 설문 조사를 실시했다." },
        { day: 21, word: "deducted", initial: "d", sentence: "Taxes will automatically be ____ from your salary every month.", translation: "세금은 매달 당신의 월급에서 자동으로 공제될 것이다." },
        { day: 21, word: "prospered", initial: "p", sentence: "His business ____ despite the economic crisis.", translation: "경제 위기에도 불구하고 그의 사업은 번창했다." },
        { day: 21, word: "despair", initial: "d", sentence: "She decided not to give in to ____ but to keep trying.", translation: "그녀는 절망에 굴복하지 않고 계속 시도하기로 결심했다." },
        { day: 21, word: "entertained", initial: "e", sentence: "The comedian ____ the crowd skillfully.", translation: "그 코미디언은 능숙하게 군중을 즐겁게 했다." },
        { day: 21, word: "sustained", initial: "s", sentence: "Giving is more ____ by selfless motives than by selfish ones.", translation: "기부는 이기적인 동기보다 이타적인 동기에 의해 더 지속된다." },
        { day: 21, word: "retains", initial: "r", sentence: "He ____ the world record in the 100-meter dash.", translation: "그는 100미터 경주에서 세계 기록을 보유하고 있다." },
        { day: 21, word: "continent", initial: "c", sentence: "Australia is smaller than any other ____ in the world.", translation: "오스트레일리아 대륙은 세계의 다른 어떤 대륙보다 더 작다." },
        { day: 21, word: "attained", initial: "a", sentence: "Her ultimate goal was ____ earlier than she expected.", translation: "그녀의 궁극적인 목표는 그녀가 예상했던 것보다 일찍 달성되었다." },
        { day: 21, word: "integrate", initial: "i", sentence: "It takes a lot of time for immigrants to ____ into society.", translation: "이민자들이 사회에 통합되는 데는 많은 시간이 걸린다." },

        // Day 22
        { day: 22, word: "withdrew", initial: "w", sentence: "They ____ their troops from the conflict zone.", translation: "그들은 분쟁 지역에서 병력을 철수했다." },
        { day: 22, word: "withhold", initial: "w", sentence: "He will ____ payment until the work is completed.", translation: "그는 일이 완료될 때까지 지불을 보류할 것이다." },
        { day: 22, word: "withstand", initial: "w", sentence: "The buildings in this area were built to ____ earthquakes.", translation: "이 지역의 건물들은 지진을 견딜 수 있도록 지어졌다." },
        { day: 22, word: "abolished", initial: "a", sentence: "Some people insist that the death penalty should be ____.", translation: "어떤 사람들은 사형 제도가 폐지되어야 한다고 주장한다." },
        { day: 22, word: "Adolescents", initial: "A", sentence: "____ may distance themselves from their parents during emotional crises.", translation: "청소년들은 정서적 위기 상황에서 부모와 거리를 둘 수 있다." },
        { day: 22, word: "discern", initial: "d", sentence: "Look inward to ____ what you're capable of.", translation: "당신이 무엇을 할 수 있는지 파악하기 위해 내면을 들여다보라." },
        { day: 22, word: "criticize", initial: "c", sentence: "You shouldn't ____ someone who you don't know well.", translation: "당신은 잘 알지도 못하는 사람을 비난해서는 안 된다." },
        { day: 22, word: "discriminate", initial: "d", sentence: "It is unfair to ____ on the grounds of race or gender.", translation: "인종이나 성별을 이유로 차별하는 것은 부당하다." },
        { day: 22, word: "biographies", initial: "b", sentence: "Children can learn a lot by reading the ____ of famous people.", translation: "아이들은 유명한 사람들의 전기를 읽음으로써 많은 것을 배울 수 있다." },
        { day: 22, word: "biology", initial: "b", sentence: "To study ____ is to learn about ourselves.", translation: "생물학을 공부하는 것은 우리 자신에 대해 배우는 것이다." },
        { day: 22, word: "resigned", initial: "r", sentence: "My father ____ from his position last month.", translation: "우리 아버지께서는 지난달에 그의 직위에서 물러나셨다." },
        { day: 22, word: "significant", initial: "s", sentence: "It was a ____ event in the country's history.", translation: "그것은 그 나라의 역사에서 중요한 사건이었다." },
        { day: 22, word: "capable", initial: "c", sentence: "We never thought he was ____ of finishing this task.", translation: "우리는 결코 그가 이 업무를 끝낼 수 있을 거라고 생각하지 않았다." },
        { day: 22, word: "captive", initial: "c", sentence: "The ____ soldiers tried to escape from the enemy.", translation: "포로가 된 군인들이 적군으로부터 탈출하려 애썼다." },
        { day: 22, word: "conceived", initial: "c", sentence: "He alone ____ the new business plan.", translation: "그는 혼자 새로운 사업 계획을 생각해 냈다." },

        { day: 25, word: "arrested", initial: "a", sentence: "They ____ him for theft and gun possession.", translation: "그들은 그를 절도 및 총기 소지 혐의로 체포했다." },
        { day: 25, word: "constant", initial: "c", sentence: "Her success was the result of her ____ efforts.", translation: "그녀의 성공은 끊임없는 노력의 결실이었다." },

        // Day 26
        { day: 26, word: "elaborate", initial: "e", sentence: "As programming code becomes more ____, software bugs increase.", translation: "프로그래밍 코드가 더 정교해지면서, 소프트웨어 버그가 증가한다." },
        { day: 26, word: "collaborating", initial: "c", sentence: "My company is ____ with an Indian company on this project.", translation: "우리 회사는 이 프로젝트에서 인도 회사와 공동으로 일하고 있다." },
        { day: 26, word: "laboratory", initial: "l", sentence: "Several experiments are being conducted in the ____.", translation: "여러 실험이 실험실에서 수행되고 있다." },
        { day: 26, word: "inspected", initial: "i", sentence: "I had my baggage ____ before boarding the plane.", translation: "나는 비행기에 탑승하기 전에 수하물을 검사받았다." },
        { day: 26, word: "spectacle", initial: "s", sentence: "The opening ceremony was quite a ____.", translation: "개회식은 꽤 장관이었다." },
        { day: 26, word: "suspected", initial: "s", sentence: "He is ____ of committing a serious cybercrime.", translation: "그는 심각한 사이버 범죄를 저지른 혐의를 받고 있다." },
        { day: 26, word: "tend", initial: "t", sentence: "We ____ to magnify the impact of new technology.", translation: "우리는 신기술의 영향을 과장하는 경향이 있다." },
        { day: 26, word: "intended", initial: "i", sentence: "I don't know what he ____ in his article.", translation: "나는 그가 그의 글에서 의도한 바를 모르겠다." },
        { day: 26, word: "tender", initial: "t", sentence: "The steak is ____, juicy, and well-seasoned.", translation: "그 스테이크는 부드럽고 육즙이 풍부하며, 간이 잘 맞아있다." },
        { day: 26, word: "tense", initial: "t", sentence: "I take a deep breath whenever I start to feel ____.", translation: "나는 긴장하기 시작할 때마다 심호흡을 한다." },
        { day: 26, word: "evaluates", initial: "e", sentence: "The company ____ its employees' performance once a year.", translation: "그 회사는 일 년에 한 번 직원들의 성과를 평가한다." },
        { day: 26, word: "equivalent", initial: "e", sentence: "He received a bonus ____ to three months' pay.", translation: "그는 3개월치 급여에 해당하는 보너스를 받았다." },
        { day: 26, word: "valid", initial: "v", sentence: "The discount coupon is ____ until the end of this month.", translation: "이 할인 쿠폰은 이번 달 말까지 유효하다." },
        { day: 26, word: "privileges", initial: "p", sentence: "Your membership ____ will be suspended if you do not pay.", translation: "돈을 내지 않으면 당신의 회원 자격 특혜가 중지될 것입니다." },
        { day: 26, word: "colleagues", initial: "c", sentence: "She establishes good relationships with her ____.", translation: "그녀는 동료들과 좋은 관계를 맺는다." },
        { day: 26, word: "liberal", initial: "l", sentence: "She has a ____ attitude toward immigration.", translation: "그녀는 이민에 대해 개방적인 태도를 지니고 있다." },
        { day: 26, word: "preliminary", initial: "p", sentence: "Several candidates passed the ____ round of interviews.", translation: "몇몇 응시자들이 인터뷰 예선을 통과했다." },
        { day: 26, word: "ecology", initial: "e", sentence: "Dams are threatening the ____ of rivers.", translation: "댐이 강의 생태계를 위협하고 있다." },
        { day: 26, word: "logic", initial: "l", sentence: "I disagree with him because his ____ is flawed.", translation: "그의 논리에 결함이 있기 때문에 나는 그에게 동의하지 않는다." },
        { day: 26, word: "psychology", initial: "p", sentence: "Sports ____ says athletes must remove feelings of uncertainty to succeed.", translation: "스포츠 심리학은 선수가 성공하려면 불확실한 감정을 없애야 한다고 말한다." },
        { day: 26, word: "Manual", initial: "M", sentence: "____ labor is still required in most construction jobs.", translation: "대부분의 건설 작업에서는 여전히 육체노동이 필요하다." },
        { day: 26, word: "manuscript", initial: "m", sentence: "The ____ was written before the second edition was published.", translation: "그 원고는 두 번째 판이 발행되기 전에 쓰였다." },
        { day: 26, word: "manipulating", initial: "m", sentence: "He was accused of ____ the price of gold.", translation: "그는 금값 조작 혐의로 고발당했다." },
        { day: 26, word: "intermediate", initial: "i", sentence: "He is taking an ____-level English listening course.", translation: "그는 중급 수준의 영어 듣기 과정을 수강하고 있다." },
        { day: 26, word: "mediated", initial: "m", sentence: "We ____ their dispute over property rights.", translation: "우리는 재산권을 둘러싼 그들의 분쟁을 중재했다." },
        { day: 26, word: "medieval", initial: "m", sentence: "You can learn a lot about society by studying ____ history.", translation: "당신은 중세의 역사를 공부함으로써 사회에 대해 많이 배울 수 있다." },
        { day: 26, word: "Mediterranean", initial: "M", sentence: "The Nile River flows into the ____ Sea.", translation: "나일강은 지중해로 흘러 들어간다." },
        { day: 26, word: "Minister", initial: "M", sentence: "She was appointed the first woman ____ of Education.", translation: "그녀는 최초의 여성 교육부 장관으로 임명되었다." },
        { day: 26, word: "minor", initial: "m", sentence: "It was a ____ accident, so no one was hurt.", translation: "그것은 작은 사고여서 아무도 다치지 않았다." },
        { day: 26, word: "minimum", initial: "m", sentence: "We kindly ask that you keep your dogs' noise levels to a ____.", translation: "저희는 여러분의 반려견의 소음 수준을 최소한으로 유지해 주시기를 정중히 요청합니다." }
    ];

    // 상태 변수
    let selectedDays = [];
    let gameMode = 'swipe';
    let sortMode = 'all';
    let currentPlaylist = [];
    let currentIndex = 0;

    // DOM 요소
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const btnSelectAll = document.getElementById('btn-select-all');
    const btnStart = document.getElementById('btn-start');
    const btnQuit = document.getElementById('btn-quit');
    
    const progressText = document.getElementById('progress-text');
    const dayBadge = document.getElementById('day-badge');
    const cardSentence = document.getElementById('card-sentence');
    const cardTranslation = document.getElementById('card-translation');
    const wordDisplay = document.getElementById('word-display');
    
    const testControls = document.getElementById('test-controls');
    const swipeControls = document.getElementById('swipe-controls');
    const testInput = document.getElementById('test-input');
    const feedback = document.getElementById('feedback');
    
    const btnSubmit = document.getElementById('btn-submit');
    const btnShowAnswer = document.getElementById('btn-show-answer');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    // 모두 선택/해제
    let allSelected = false;
    btnSelectAll.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.day-checkbox:not(:disabled)');
        allSelected = !allSelected;
        checkboxes.forEach(cb => cb.checked = allSelected);
        btnSelectAll.textContent = allSelected ? "모두 해제" : "모두 선택";
    });

    // 셔플 함수
    function shuffle(array) {
        let curIndex = array.length, randomIndex;
        while (curIndex != 0) {
            randomIndex = Math.floor(Math.random() * curIndex);
            curIndex--;
            [array[curIndex], array[randomIndex]] = [array[randomIndex], array[curIndex]];
        }
        return array;
    }

    // 학습 시작
    btnStart.addEventListener('click', () => {
        const checkboxes = document.querySelectorAll('.day-checkbox:checked');
        selectedDays = Array.from(checkboxes).map(cb => parseInt(cb.value));

        if (selectedDays.length === 0) {
            alert('최소 하나 이상의 Day를 선택해 주세요!');
            return;
        }

        gameMode = document.querySelector('input[name="game-mode"]:checked').value;
        sortMode = document.querySelector('input[name="sort-mode"]:checked').value;

        let filteredData = vocabularyData.filter(item => selectedDays.includes(item.day));

        if (sortMode === 'all') {
            currentPlaylist = shuffle([...filteredData]);
        } else {
            currentPlaylist = [];
            selectedDays.sort((a, b) => a - b).forEach(dayNum => {
                let dayItems = filteredData.filter(item => item.day === dayNum);
                currentPlaylist.push(...shuffle(dayItems));
            });
        }

        currentIndex = 0;

        startScreen.classList.remove('active');
        gameScreen.classList.add('active');

        if (gameMode === 'swipe') {
            swipeControls.style.display = 'block';
            testControls.style.display = 'none';
            wordDisplay.style.display = 'block';
        } else {
            swipeControls.style.display = 'none';
            testControls.style.display = 'block';
            wordDisplay.style.display = 'none';
        }

        if (sortMode === 'day') {
            dayBadge.style.display = 'inline-block';
        } else {
            dayBadge.style.display = 'none';
        }

        renderCard();
    });

    // 그만하기
    btnQuit.addEventListener('click', () => {
        if (confirm("학습을 중단하고 메인으로 돌아가시겠습니까?")) {
            gameScreen.classList.remove('active');
            startScreen.classList.add('active');
        }
    });

    // 카드 렌더링 (예문 맨 뒤에 이니셜 배치)
    function renderCard() {
        const item = currentPlaylist[currentIndex];

        progressText.textContent = `${currentIndex + 1} / ${currentPlaylist.length}`;
        
        // 예문 맨 뒤에 이니셜 (이니셜) 첨부
        cardSentence.textContent = `${item.sentence} (${item.initial})`;
        cardTranslation.textContent = item.translation;

        if (sortMode === 'day') {
            dayBadge.textContent = `Day ${item.day}`;
        }

        wordDisplay.textContent = '';
        testInput.value = '';
        feedback.textContent = '';
        feedback.className = 'feedback';
    }

    // 스와이프 - 정답 보기
    btnShowAnswer.addEventListener('click', () => {
        const item = currentPlaylist[currentIndex];
        wordDisplay.textContent = item.word;
    });

    // 테스트 - 정답 확인
    function checkAnswer() {
        const item = currentPlaylist[currentIndex];
        const userInputValue = testInput.value.trim().toLowerCase();
        const targetWord = item.word.toLowerCase();

        if (userInputValue === targetWord) {
            feedback.textContent = `O (${item.word})`;
            feedback.className = 'feedback correct';
        } else {
            feedback.textContent = `X (${item.word})`;
            feedback.className = 'feedback incorrect';
        }
    }

    btnSubmit.addEventListener('click', checkAnswer);

    testInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // 이전 / 다음 버튼
    btnPrev.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderCard();
        } else {
            alert('첫 번째 단어입니다.');
        }
    });

    btnNext.addEventListener('click', () => {
        if (currentIndex < currentPlaylist.length - 1) {
            currentIndex++;
            renderCard();
        } else {
            alert('선택하신 모든 단어를 학습했습니다!');
        }
    });
</script>

</body>
</html>
